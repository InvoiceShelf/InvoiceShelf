# Flat, hoisted node_modules (npm/yarn-like) so the migration is a drop-in and
# transitive packages imported directly (e.g. flatpickr via vue-flatpickr-component)
# keep resolving. pnpm 11 reads these here, not from .npmrc.
nodeLinker: hoisted

# Build-script allow-listing. vue-demi needs its postinstall to select the Vue 3
# entry; it is a trusted Vue-core shim.
allowBuilds:
  vue-demi: true

# Transitive version pin migrated from package.json "resolutions" (which npm
# never actually read). brace-expansion <5 had a ReDoS advisory.
overrides:
  brace-expansion: ^5.0.6
