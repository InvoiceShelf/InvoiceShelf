<!--
  Source artwork for `pnpm -C mobile run assets`, which rasterises these into
  every density the two native projects want. All five are the mark from
  `resources/static/img/logo-mark.svg`, re-cut per layer; the rounded corners
  of that file are gone because iOS and Android each apply their own mask and
  artwork that carried its own would be rounded twice.

  icon-foreground: the upper layer of the Android adaptive icon, on
  transparency. The viewBox leaves a wide margin on purpose. A launcher
  may mask the icon to a circle, and only the inner two thirds survives
  that, so the mark is sized to sit inside the circle rather than inside
  the square: fill the layer and the corners of the mark are cut off.
-->
<svg width="1024" height="1024" viewBox="4 3.5 40.5 40.5" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(22.5 24) scale(0.78) translate(-24 -24)">
    <path d="M12,11 a4,4 0 0 1 4,-4 h16 a4,4 0 0 1 4,4 v22 l-2,4 l-2,-4 l-2,4 l-2,-4 l-2,4 l-2,-4 l-2,4 l-2,-4 l-2,4 l-2,-4 l-2,4 l-2,-4 Z" fill="none" stroke="#fff" stroke-width="2.9" stroke-linejoin="round"></path>
    <line x1="17" y1="16" x2="31" y2="16" stroke="#fff" stroke-width="2.9" stroke-linecap="round"></line>
    <line x1="17" y1="21.5" x2="26" y2="21.5" stroke="#fff" stroke-width="2.9" stroke-linecap="round"></line>
    <circle cx="33" cy="33" r="9" fill="#fff"></circle>
    <path d="M29.2 33.2 l2.6 2.7 l4.6 -5.6" fill="none" stroke="#4A3DFF" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>
</svg>
